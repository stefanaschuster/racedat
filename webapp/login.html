<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login · Racedat</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg-2:#141414;
  --ink:#f5f5f0; --ink-dim:#a0a0a0; --ink-faint:#888;
  --line:#262626;
  --a-color:#ff3d00; --accent:#00d4ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;line-height:1.5;min-height:100vh}
.page{max-width:480px;margin:0 auto;padding:64px 32px 80px;min-height:calc(100vh - 68px);display:flex;flex-direction:column;justify-content:center}



.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:16px}
h1{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:.9;letter-spacing:.01em;background:linear-gradient(180deg,var(--ink) 0%,#888 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.subtitle{color:var(--ink-dim);font-size:13px;line-height:1.6;margin-bottom:32px}

.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.15em;text-transform:uppercase}
.field input{
  background:var(--bg-2);border:1px solid var(--line);
  color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:15px;
  padding:12px 16px;outline:none;
}
.field input:focus{border-color:var(--accent)}

.btn{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;
  background:var(--accent);color:#000;border:none;padding:14px 32px;
  cursor:pointer;width:100%;margin-top:8px;
}
.btn:hover{background:#1ee4ff}

.error-banner{background:#2a0a05;border-left:3px solid var(--a-color);padding:14px 20px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);display:none}
.error-banner.active{display:block}
.info-banner{background:#0a1f24;border-left:3px solid var(--accent);padding:14px 20px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);display:none}
.info-banner.active{display:block}
.link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;padding:0}
.link-btn:hover{color:#1ee4ff}

.note{
  margin-top:32px;padding:16px 20px;
  background:var(--bg-2);border-left:3px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--ink-dim);line-height:1.6;
}
.note strong{color:var(--ink)}

footer{margin-top:48px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center;letter-spacing:.05em}

@media (max-width:600px){
  .page{padding:32px 16px 48px}
  h1{font-size:36px}
  footer{margin-top:32px}
  .field input{font-size:16px}
}
</style>
</head>
<body>
{{HEADER}}
<div class="page">

  {{ERROR_HTML}}
  {{INFO_HTML}}

  <div class="eyebrow">Login</div>
  <h1>ANMELDEN</h1>
  <div class="subtitle">
    Zum Hochladen und Verwalten von Sessions ist ein Account nötig.
    Lesen, Vergleichen und Analysieren funktionieren auch ohne Login.
  </div>

  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{NEXT_URL}}">
    <div class="field">
      <label>E-Mail</label>
      <input type="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label>Passwort</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">ANMELDEN →</button>
  </form>

  <div class="note">
    <strong>Noch keinen Account?</strong>
    <a href="/register" style="color:var(--accent)">Jetzt registrieren →</a>
  </div>

  <footer>RACEDAT · FASTER WITH DATA<br><a href="/impressum" style="color:inherit;text-decoration:none">Impressum</a> · <a href="/datenschutz" style="color:inherit;text-decoration:none">Datenschutz</a></footer>
</div>
</body>
</html>
